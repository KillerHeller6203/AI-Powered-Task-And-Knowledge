[project]
  name = "taskiq-backend"
  version = "1.0.0"
  description = "AI-Powered Task & Knowledge Management System - FastAPI Backend"
  requires-python = ">=3.12"
  dependencies = [
      "fastapi>=0.115.0",
      "uvicorn[standard]>=0.32.0",
      "sqlalchemy>=2.0.0",
      "alembic>=1.13.0",
      "pymysql>=1.1.0",
      "python-jose[cryptography]>=3.3.0",
      "passlib[bcrypt]>=1.7.4",
      "python-multipart>=0.0.12",
      "pydantic-settings>=2.5.0",
      "scikit-learn>=1.5.0",
      "numpy>=1.26.0",
  ]

  [build-system]
  requires = ["hatchling"]
  build-backend = "hatchling.build"
  